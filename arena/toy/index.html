  #menu button{display:block;width:100%;margin:7px 0;height:46px;border-radius:14px;border:0;font-size:16px;font-weight:800;color:#fff;background:linear-gradient(#ff8a3d,#e0532a)}
  #menu button.alt{background:#3a2a58}

<body class="intro">

<div id="ann"><i>🎙</i><span id="annt"></span></div>
<div id="pcard"><b id="pcn"></b><span id="pct"></span></div>

<div id="bcancel">✕</div><div class="btn" id="bfire"><svg class="ring" viewBox="0 0 96 96"><circle cx="48" cy="48" r="45" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="5"/><circle id="pring" cx="48" cy="48" r="45" fill="none" stroke="#ffe27a" stroke-width="5" stroke-linecap="round" stroke-dasharray="283" stroke-dashoffset="283"/></svg>ירי</div>
<div class="btn" id="bjump"><svg viewBox="0 0 24 24"><path d="M5 15l7-7 7 7" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>קפיצה</div>

<div class="btn" id="bally"><span id="allyic">🤝</span></div>

<div id="menu" style="display:none"><div class="card">
  <h1>הזירה</h1>
  <p>מופע ההישרדות של העונה. 4 מתמודדים, כל אחד בפינה אחרת, ורק אחד יוצא.</p>
  <div id="arena"><button data-a="grass" class="sel">אי הדשא</button><button data-a="arch">ארכיפלג</button><button data-a="volcano">הר הגעש</button></div>

  <button id="pass" class="alt">4 שחקנים על טלפון אחד</button>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
{
// =====================================================================
// constants and helpers
// =====================================================================
const G0=14;let G=G0;const CRAD=.34, WALK=3.1, STAM_WALK=17, STAM_JUMP=20, TURN_T=40;
let A=22;                                     // island size (units), picked in the menu
let L,N=160,CS,H;                             // heightmap span, cells, cell size, heights
let water=0;
function hash(x,y){let h=(x|0)*374761393+(y|0)*668265263;h=(h^(h>>>13))*1274126177;return((h^(h>>>16))>>>0)/4294967295}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,s=t=>t*t*(3-2*t);
  const a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);return a+(b-a)*s(xf)+(c-a)*s(yf)+(a-b-c+d)*s(xf)*s(yf)}
const sstep=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t)};
const lerp=(a,b,t)=>a+(b-a)*t;

// =====================================================================
// heightmap terrain
// =====================================================================
let burn;
let arenaType='grass';
function genTerrain(){
  L=A+14;CS=L/N;H=new Float32Array((N+1)*(N+1));burn=new Float32Array((N+1)*(N+1));
  const sd=Math.random()*50,half=A/2;
  for(let j=0;j<=N;j++)for(let i=0;i<=N;i++){
    const x=-L/2+i*CS,z=-L/2+j*CS;
    const s=Math.pow(Math.pow(Math.abs(x),4)+Math.pow(Math.abs(z),4),.25)/half;     // rounded square: four real corners
    if(arenaType==='arch'){// five islands: one per corner and one in the middle, water channels between
      let h=-2.6;for(const [ix,iz,R0] of [[.3,.3,.17],[-.3,.3,.17],[-.3,-.3,.17],[.3,-.3,.17],[0,0,.15]]){const r=Math.hypot(x-ix*A,z-iz*A)/(R0*A);h=Math.max(h,lerp(1.5,-2.6,sstep(.7,1.08,r))+(r<.7?1.1*Math.exp(-r*r*3):0))}
      h+=(vnoise(x*.35+sd,z*.35)-.5)*.6*(h>0?1:.2)+(vnoise(x*1.2,z*1.2+sd)-.5)*.12;H[j*(N+1)+i]=h;continue}
    if(arenaType==='volcano'){// a rim of rock around a lava pit in the middle: everything must go over the rim
      let h=lerp(1.05,-2.6,sstep(.8,1.04,s));const d=Math.hypot(x,z);h+=3.6*Math.exp(-Math.pow((d-A*.2)/(A*.065),2));h-=5.2*Math.exp(-Math.pow(d/(A*.11),2));
      h+=(vnoise(x*.3+sd,z*.3)-.5)*.8*(1-sstep(.85,1,s))+(vnoise(x*1.2,z*1.2+sd)-.5)*.14;H[j*(N+1)+i]=h;continue}
    let h=lerp(1.05,-2.6,sstep(.8,1.04,s));
    const d=Math.hypot(x,z);
